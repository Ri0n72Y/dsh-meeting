name: Windows WASAPI native check
on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/meeting-capture/native/src/**'
      - 'packages/meeting-capture/native/CMakeLists.txt'
      - 'packages/meeting-capture/native/package.json'
      - '.github/workflows/windows-addon.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-addon:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compile patched Windows WASAPI addon
        working-directory: packages/meeting-capture/native
        shell: pwsh
        run: |
          npm install --no-package-lock --no-audit --no-fund --ignore-scripts
          npm run build
      - name: Verify compiled Windows N-API entry
        shell: pwsh
        run: |
          node -e "const addon = require('./packages/meeting-capture/native/build/Release/loopback_capture_addon.node'); const capture = new addon.LoopbackCapture(); if (typeof capture.startSystemAudio !== 'function' || typeof capture.stop !== 'function') process.exit(1); console.log('MEETING_WASAPI_NATIVE_LOAD_PASS')"
      - uses: actions/upload-artifact@v4
        with:
          name: meeting-wasapi-win32-x64-node24
          path: packages/meeting-capture/native/build/Release/loopback_capture_addon.node
          if-no-files-found: error

