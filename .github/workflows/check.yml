name: Focused checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Source typecheck without generated dist
        run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Typecheck with generated dist present
        run: pnpm run typecheck
      - run: pnpm proof
      - name: Verify independent DSH profile bundles without loading models
        timeout-minutes: 5
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-meeting-profile
        run: |
          set -euo pipefail
          cli=(pnpm dlx @deepseek-ai/dsh@0.2.0-rc.2)
          run_cli() {
            echo "::notice::DSH profile smoke: $*"
            timeout --signal=TERM --kill-after=5s 65s "${cli[@]}" "$@"
          }
          run_cli --profile meeting-ci --from-default-profile web --dump-default-config > "$RUNNER_TEMP/meeting-base.yml"
          run_cli plugin --profile meeting-ci add ./packages/meeting-context
          run_cli plugin --profile meeting-ci add ./packages/meeting-speaker
          run_cli plugin --profile meeting-ci add @deepseek-ai/dsh-experimental-voice-input-bundle@0.2.0-rc.2
          run_cli plugin --profile meeting-ci add ./packages/meeting-capture
          run_cli plugin --profile meeting-ci add ./packages/meeting-ui
          echo "::notice::All four DSH installs complete; now dumping profile configuration"
          run_cli --profile meeting-ci --dump-config > "$RUNNER_TEMP/meeting-composed.yml"
          echo "::notice::DSH profile configuration returned successfully"
          for id in meeting-context meeting-speaker meeting-capture speech-to-text speech-to-text-sensevoice meeting-control; do
            grep -Fq "id: $id" "$RUNNER_TEMP/meeting-composed.yml"
          done

  windows-addon:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Compile patched Windows WASAPI addon
        working-directory: packages/meeting-capture/native
        shell: pwsh
        run: |
          npm install --no-package-lock --no-audit --no-fund --ignore-scripts
          npm run build
      - name: Load patched addon and exercise callback-drain tests
        shell: pwsh
        run: |
          node -e "const addon = require('./packages/meeting-capture/native/build/Release/loopback_capture_addon.node'); const capture = new addon.LoopbackCapture(); if (typeof capture.startSystemAudio !== 'function' || typeof capture.stop !== 'function') process.exit(1); console.log('MEETING_WASAPI_NATIVE_LOAD_PASS')"
          pnpm exec tsx --test tests/windows-loopback.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: meeting-wasapi-win32-x64-node24
          path: packages/meeting-capture/native/build/Release/loopback_capture_addon.node
          if-no-files-found: error

  web-profile-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DSH_HOME: ${{ github.workspace }}/.meeting-profile-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Diagnose actual built Host plugin ESM entry
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "await import('./packages/meeting-ui/dist/index.js'); console.log('MEETING_HOST_ESM_IMPORT_PASS')"
      - name: Install Meeting Profile via real DSH CLI
        shell: bash
        run: |
          set -euo pipefail
          cli=(pnpm dlx @deepseek-ai/dsh@0.2.0-rc.2)
          run_cli() { timeout --signal=TERM --kill-after=5s 70s "${cli[@]}" "$@"; }
          run_cli --profile meeting-runtime --from-default-profile web --dump-default-config > /dev/null
          run_cli plugin --profile meeting-runtime add ./packages/meeting-context
          run_cli plugin --profile meeting-runtime add ./packages/meeting-speaker
          run_cli plugin --profile meeting-runtime add @deepseek-ai/dsh-experimental-voice-input-bundle@0.2.0-rc.2
          run_cli plugin --profile meeting-runtime add ./packages/meeting-capture
          run_cli plugin --profile meeting-runtime add ./packages/meeting-ui
      - name: Boot the actual DSH Web server and inspect client plugin graph
        shell: bash
        run: |
          set -euo pipefail
          port=35409
          timeout --signal=TERM --kill-after=5s 65s pnpm dlx @deepseek-ai/dsh@0.2.0-rc.2 --profile meeting-runtime --no-open --port "$port" > "$RUNNER_TEMP/meeting-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl --silent --show-error --max-time 2 "http://127.0.0.1:$port/" > "$RUNNER_TEMP/meeting-index.html" 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "::error::DSH Web did not serve the shell HTML"
            tail -n 130 "$RUNNER_TEMP/meeting-web.log"
            exit 1
          fi
          echo "DSH_WEB_HTTP_PASS"
          # DSH's boot graph is part of the authenticated HTML, not the unauthenticated shell.
          auth_url=$(grep -Eo 'http://127[.]0[.]0[.]1:[0-9]+/[?]token=[A-Za-z0-9_-]+' "$RUNNER_TEMP/meeting-web.log" | tail -n 1)
          if [ -z "$auth_url" ]; then
            echo "::error::DSH did not print an authenticated Web URL"
            exit 1
          fi
          curl --fail --silent --show-error --location --max-time 10 \
            --cookie-jar "$RUNNER_TEMP/meeting-cookie.txt" \
            "$auth_url" > "$RUNNER_TEMP/meeting-index.html"
          if grep -Fq "@ri0n72y/dsh-meeting-ui" "$RUNNER_TEMP/meeting-index.html"; then
            echo "MEETING_UI_CLIENT_MANIFEST_PASS"
          else
            echo "::error::DSH Client manifest does not include Meeting UI"
            echo "Authenticated HTML bytes: $(wc -c < "$RUNNER_TEMP/meeting-index.html")"
            echo "Client boot marker count: $(grep -o '__DSH_BOOT__' "$RUNNER_TEMP/meeting-index.html" | wc -l)"
            tail -n 40 "$RUNNER_TEMP/meeting-web.log" | sed -E 's/(token=)[A-Za-z0-9_-]+/\1[REDACTED]/g'
            exit 1
          fi
          # Real authenticated Gateway RPC: invoking a nonexistent Session must
          # reach the Meeting service and return its business error, never 404
          # or gateway/invocation-unavailable. A client manifest alone is insufficient.
          for method in snapshot start stop prepare summarize; do
            printf '{"type":"client-request","rpcId":"proof-%s","method":"meeting/%s","payload":{"args":{"sessionId":"meeting-ci-nonexistent"}}}' "$method" "$method" > "$RUNNER_TEMP/meeting-request.json"
            curl --fail --silent --show-error --max-time 10 \
              -b "$RUNNER_TEMP/meeting-cookie.txt" \
              -H 'content-type: application/json' \
              --data-binary "@$RUNNER_TEMP/meeting-request.json" \
              "http://127.0.0.1:$port/api/meeting/$method" > "$RUNNER_TEMP/meeting-response.json"
            python3 - "$method" "$RUNNER_TEMP/meeting-response.json" <<'PY'
          import json,sys
          method,path=sys.argv[1:]
          with open(path,encoding='utf8') as file: obj=json.load(file)
          result=obj.get('result',{})
          error=result.get('error',{})
          assert obj.get('type')=='server-response', (method,obj)
          assert result.get('ok') is False, (method,obj)
          text=error.get('message','')
          expected={
           'snapshot':'Meeting requires a live DSH Session',
           'start':'SenseVoice',
           'stop':'Meeting is not recording',
           'prepare':'Meeting Session is unavailable',
           'summarize':'Meeting Session is no longer available',
          }
          assert expected[method] in text, (method,obj)
          print('MEETING_GATEWAY_ROUNDTRIP_PASS',method)
          PY
          done
