name: Focused checks
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'
      - run: pnpm install --no-frozen-lockfile
      - name: Source typecheck without generated dist
        run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Synchronize lockfile and prebuilt lib on migration branch
        if: github.ref == 'refs/heads/chore/dsh-0.2.2-rc1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml lib/
          if ! git diff --cached --quiet; then
            git commit -m 'build: synchronize rc.1 lockfile and Meeting bundles'
            git push origin HEAD:chore/dsh-0.2.2-rc1
          fi
      - name: Verify committed lib matches source
        run: pnpm run check:prebuilt
