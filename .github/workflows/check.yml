name: Focused checks
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Node 22 lockfile for alignment review
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Show lockfile changes (temporary diagnostic)
        run: git --no-pager diff -- pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Source typecheck without generated dist
        run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Verify committed lib matches source
        run: pnpm run check:prebuilt
